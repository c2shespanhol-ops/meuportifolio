<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artefato Técnico | Relatório de Lead Time e Métricas Ágeis</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0D0F10; --bg2: #131618; --bg3: #1A1D20; --gold: #C5A25D; --gold-lt: #DEC082; --text: #FFFFFF; --text-muted: #A0A5A8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; padding: 40px 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; background: var(--bg2); border: 1px solid var(--bg3); padding: 40px; border-radius: 6px; }
        .header { border-bottom: 1px solid var(--bg3); padding-bottom: 20px; margin-bottom: 30px; }
        .badge { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
        h1 { font-size: 1.8rem; color: var(--text); margin-bottom: 10px; }
        p.desc { color: var(--text-muted); font-size: 0.95rem; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; }
        .kpi-card { background: var(--bg3); padding: 20px; border-left: 3px solid var(--gold); border-radius: 0 4px 4px 0; }
        .kpi-val { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; color: var(--gold-lt); margin-bottom: 5px; }
        .kpi-lbl { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-family: 'Orbitron', sans-serif; }
        .btn-back { display: inline-block; margin-top: 20px; color: var(--gold); text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; border: 1px solid var(--gold); padding: 10px 20px; border-radius: 3px; transition: all 0.3s ease; }
        .btn-back:hover { background: var(--gold); color: var(--bg); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="badge">Artefato Técnico &bull; Caso 02</div>
            <h1>Relatório de Desempenho e Eficiência de Fluxo</h1>
            <p class="desc">Acompanhamento do impacto de limites de WIP e redução de gargalos na esteira de desenvolvimento.</p>
        </div>
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-val">-71%</div>
                <div class="kpi-lbl">Lead Time Reduzido</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-val">+45%</div>
                <div class="kpi-lbl">Vazão (Throughput)</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-val">0</div>
                <div class="kpi-lbl">Gargalos Críticos</div>
            </div>
        </div>
        <a href="case_study_02_leadtime_final.html" class="btn-back">&larr; Voltar ao Estudo de Caso</a>
    </div>
</body>
</html>
