<style>
  :root {
    --bg:        #0E1114;
    --bg2:       #13181D;
    --bg3:       #1A2028;
    --gold:      #C9A84C;
    --gold-lt:   #E8C060;
    --teal:      #26505A;
    --teal-br:   #3A7A8A;
    --coral:     #F57F76;
    --white:     #F0F6FC;
    --gray1:     #8B949E;
    --gray2:     #4A5568;
    --border:    rgba(201,168,76,0.18);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    line-height: 1.7;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .hero {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    position: relative;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 80% 20%, rgba(201,168,76,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 10% 80%, rgba(58,122,138,0.06) 0%, transparent 50%),
      linear-gradient(160deg, #0E1114 0%, #111820 60%, #0A0E12 100%);
  }

  .orb {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,168,76,0.05) 0%, transparent 70%);
    top: -100px;
    right: -100px;
    animation: orbFloat 8s ease-in-out infinite;
  }

  @keyframes orbFloat {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-30px, 40px) scale(1.05); }
  }

  .nav {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 64px;
    border-bottom: 0.5px solid var(--border);
  }

  .nav-brand { display: flex; align-items: center; gap: 14px; }

  .h-mark {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 14px; font-weight: 700;
    color: var(--gold);
    position: relative;
  }

  .h-mark::after {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    border: 0.5px solid rgba(201,168,76,0.2);
  }

  .nav-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    color: var(--white);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
