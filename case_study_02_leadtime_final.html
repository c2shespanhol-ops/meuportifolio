<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Study 02 — Redução de 71% no Lead Time · Cleyton Hespanhol</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0E1114;
    --bg2:       #13181D;
    --bg3:       #1A2028;
    --gold:      #C9A84C;
    --gold-lt:   #E8C060;
    --teal:      #26505A;
    --teal-br:   #3A7A8A;
    --coral:     #F57F76;
    --white:     #F0F6FC;
    --gray1:     #8B949E;
    --gray2:     #4A5568;
    --border:    rgba(201,168,76,0.18);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    line-height: 1.7;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .hero {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    position: relative;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 80% 20%, rgba(201,168,76,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 10% 80%, rgba(58,122,138,0.06) 0%, transparent 50%),
      linear-gradient(160deg, #0E1114 0%, #111820 60%, #0A0E12 100%);
  }

  .orb {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,168,76,0.05) 0%, transparent 70%);
    top: -100px;
    right: -100px;
    animation: orbFloat 8s ease-in-out infinite;
  }

  @keyframes orbFloat {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-30px, 40px) scale(1.05); }
  }

  .nav {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 64px;
    border-bottom: 0.5px solid var(--border);
  }

  .nav-brand { display: flex; align-items: center; gap: 14px; }

  .h-mark {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 14px; font-weight: 700;
    color: var(--gold);
    position: relative;
  }

  .h-mark::after {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    border: 0.5px solid rgba(201,168,76,0.2);
  }

  .nav-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    color: var(--white);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .nav-role {
    font-family: 'Orbitron', monospace;
    font-size: 7px; color: var(--gold);
    letter-spacing: 0.15em;
    display: block; margin-top: 2px;
  }

  .nav-tag {
    font-family: 'Orbitron', monospace;
    font-size: 8px; color: var(--gray1);
    letter-spacing: 0.12em;
    padding: 6px 14px;
    border: 0.5px solid var(--border);
    border-radius: 2px;
  }

  .hero-content {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 80px 64px;
    max-width: 900px;
  }

  .case-label {
    display: inline-flex; align-items: center;
    gap: 8px; margin-bottom: 32px;
    animation: fadeUp 0.8s ease forwards;
  }

  .case-label-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .case-label-text {
    font-family: 'Orbitron', monospace;
    font-size: 9px; color: var(--gold);
    letter-spacing: 0.2em; font-weight: 600;
  }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(52px, 7vw, 88px);
    font-weight: 300; line-height: 1.05;
    color: var(--white); margin-bottom: 8px;
    animation: fadeUp 0.9s ease forwards;
    animation-delay: 0.1s; opacity: 0;
  }

  .hero-title em { font-style: italic; color: var(--gold); }

  .hero-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 300; color: var(--gray1);
    margin-bottom: 40px;
    animation: fadeUp 1s ease forwards;
    animation-delay: 0.2s; opacity: 0;
  }

  .hero-desc {
    font-size: 15px;
    color: rgba(240,246,252,0.7);
    max-width: 560px; line-height: 1.8;
    margin-bottom: 48px;
    animation: fadeUp 1s ease forwards;
    animation-delay: 0.3s; opacity: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .meta-row {
    display: flex; gap: 12px; flex-wrap: wrap;
    animation: fadeUp 1s ease forwards;
    animation-delay: 0.4s; opacity: 0;
  }

  .meta-pill {
    padding: 8px 18px;
    border: 0.5px solid var(--border);
    border-radius: 2px;
    font-size: 11px; color: var(--gray1);
    background: rgba(201,168,76,0.04);
    letter-spacing: 0.04em;
  }

  .meta-pill strong { color: var(--gold); font-weight: 500; }

  .hero-footer {
    position: relative; z-index: 10;
    padding: 24px 64px;
    border-top: 0.5px solid var(--border);
    display: flex; align-items: center; gap: 40px;
  }

  .scroll-hint {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Orbitron', monospace;
    font-size: 8px; color: var(--gray2);
    letter-spacing: 0.15em;
    animation: fadeUp 1s ease forwards;
    animation-delay: 0.6s; opacity: 0;
  }

  .scroll-line {
    width: 40px; height: 0.5px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }

  /* Big metric display */
  .metric-hero {
    position: absolute;
    right: 64px; top: 50%;
    transform: translateY(-50%);
    text-align: center;
    z-index: 10;
    animation: fadeUp 1s ease forwards;
    animation-delay: 0.5s; opacity: 0;
  }

  .metric-hero-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 140px; font-weight: 300;
    line-height: 1;
    color: rgba(201,168,76,0.15);
    display: block;
    position: relative;
  }

  .metric-hero-number::after {
    content: '71%';
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 100px;
    color: var(--gold);
    opacity: 0.9;
  }

  .metric-hero-label {
    font-family: 'Orbitron', monospace;
    font-size: 8px; color: var(--gray1);
    letter-spacing: 0.2em;
    margin-top: 8px;
  }

  main { position: relative; z-index: 1; }

  .section {
    padding: 100px 64px;
    border-bottom: 0.5px solid rgba(201,168,76,0.08);
    position: relative;
  }

  .section-inner { max-width: 1100px; margin: 0 auto; }

  .section-label {
    font-family: 'Orbitron', monospace;
    font-size: 8px; color: var(--gold);
    letter-spacing: 0.25em;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }

  .section-label::after {
    content: '';
    flex: 1; height: 0.5px;
    background: var(--border);
    max-width: 60px;
  }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(32px, 4vw, 52px);
    font-weight: 300; line-height: 1.15;
    color: var(--white); margin-bottom: 48px;
  }

  .section-title em { font-style: italic; color: var(--gold); }

  /* Problem grid */
  .problem-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
  }

  .problem-card {
    background: var(--bg2);
    padding: 48px 40px;
    position: relative; overflow: hidden;
    transition: background 0.3s ease;
  }

  .problem-card:hover { background: var(--bg3); }

  .problem-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .problem-card.friction::before { background: var(--coral); }
  .problem-card.solution::before { background: var(--gold); }

  .card-eyebrow {
    font-family: 'Orbitron', monospace;
    font-size: 8px; letter-spacing: 0.2em;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }

  .card-eyebrow.friction { color: var(--coral); }
  .card-eyebrow.solution { color: var(--gold); }

  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px; font-weight: 400;
    color: var(--white); margin-bottom: 16px;
    line-height: 1.2;
  }

  .card-body { font-size: 14px; color: var(--gray1); line-height: 1.8; }

  .card-list { list-style: none; margin-top: 20px; }

  .card-list li {
    font-size: 13px;
    color: rgba(240,246,252,0.7);
    padding: 8px 0;
    border-bottom: 0.5px solid rgba(201,168,76,0.08);
    display: flex; align-items: flex-start;
    gap: 10px; line-height: 1.5;
  }

  .card-list li::before {
    content: '·';
    color: var(--gold);
    flex-shrink: 0; margin-top: 1px;
  }

  /* Process */
  .process-bg { background: var(--bg2); }

  .process-timeline {
    position: relative;
    padding-left: 40px;
  }

  .process-timeline::before {
    content: '';
    position: absolute;
    left: 0; top: 8px; bottom: 8px;
    width: 1px;
    background: linear-gradient(180deg, var(--gold), rgba(201,168,76,0.1));
  }

  .process-step {
    position: relative;
    margin-bottom: 56px;
    animation: fadeUp 0.6s ease forwards;
    opacity: 0;
  }

  .process-step:nth-child(1) { animation-delay: 0.1s; }
  .process-step:nth-child(2) {
