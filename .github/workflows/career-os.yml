name: Career OS validation

on:
  push:
    branches:
      - feat/portfolio-2-career-os-foundation
  pull_request:
    branches:
      - main

jobs:
  career-os-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/test-job-matcher.mjs
      - run: node scripts/test-job-pack.mjs
      - run: node scripts/test-linkedin-profile.mjs
      - run: node scripts/test-real-vacancy.mjs
      - run: node scripts/test-bhs-vacancy.mjs
      - run: node scripts/test-application-tracker.mjs
