name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'docs' \
            --exclude 'data' \
            --exclude 'career-os' \
            --exclude 'scripts' \
            --exclude '_site'

      - name: Apply shared design system to all HTML pages
        run: python scripts/ensure_shared_theme.py _site

      - name: Generate recruiter CV PDFs
        run: |
          mkdir -p .build_fonts
          curl -fsSL https://raw.githubusercontent.com/googlefonts/dm-fonts/main/Sans/Exports/DMSans-Regular.ttf -o .build_fonts/DMSans-Regular.ttf
          curl -fsSL https://raw.githubusercontent.com/googlefonts/dm-fonts/main/Sans/Exports/DMSans-Bold.ttf -o .build_fonts/DMSans-Bold.ttf
          python -m pip install --disable-pip-version-check --no-input reportlab
          python scripts/build_cv_pdfs.py

      - name: Validate HTML structure and internal links
        run: python scripts/validate_html.py _site

      - name: Validate copy spacing
        run: python scripts/validate_copy_quality.py _site

      - name: Install responsive test browser
        run: |
          npm install --no-save playwright cspell @cspell/dict-pt-br@2.4.4
          npx cspell --no-progress --config cspell.json "_site/**/*.html"
          npx playwright install --with-deps chromium
          python -m http.server 8765 --directory _site >/tmp/portfolio-http.log 2>&1 &
          sleep 2
          node scripts/validate_responsive.mjs

      - name: Validate public artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/en/index.html
          grep -q "photo-fallback-mark" _site/index.html
          grep -q "photo-fallback-mark" _site/en/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/cv/cv-pt.html
          test -f _site/cv/cv-en.html
          test -f _site/cv/Cleyton-Hespanhol-Product-Owner-PT.pdf
          test -f _site/cv/Cleyton-Hespanhol-Product-Owner-EN.pdf
          test "$(head -c 4 _site/cv/Cleyton-Hespanhol-Product-Owner-PT.pdf)" = "%PDF"
          test "$(head -c 4 _site/cv/Cleyton-Hespanhol-Product-Owner-EN.pdf)" = "%PDF"
          grep -q "31% menos retrabalho" _site/cv/cv-pt.html
          grep -q "31% less rework" _site/cv/cv-en.html
          grep -q "31% de ganho de eficiência" _site/cv/cv-pt.html
          grep -q "31% efficiency gain" _site/cv/cv-en.html
          ! grep -qiE "31% de aumento na eficiência operacional|31% increase in operational efficiency" _site/cv/cv-pt.html _site/cv/cv-en.html
          ! grep -qiE "40% relatado|20% relatado|40% reported|20% reported" _site/index.html _site/en/index.html
          ! grep -qiE "Product Operations|Product Ops" _site/case_study_05_pav_receita_federal_final.html _site/en/cases/case-05-pav-receita-federal.html _site/cv/cv-pt.html _site/cv/cv-en.html
          test "$(grep -c '<h3>' _site/cv/cv-pt.html)" -eq 3
          test "$(grep -c '<h3>' _site/cv/cv-en.html)" -eq 3
          grep -q "Supergasbras | Analista de Operações e Experiência do Cliente" _site/cv/cv-pt.html
          grep -q "jan/2018 – jun/2024" _site/cv/cv-pt.html
          grep -q "Supergasbras | Operations &amp; Customer Experience Analyst" _site/cv/cv-en.html
          grep -q "Jan 2018 – Jun 2024" _site/cv/cv-en.html
          ! grep -qiE "SHVB|SHV Energy|Peixe Urbano|Nextel" _site/cv/cv-pt.html _site/cv/cv-en.html
          grep -q "40% de redução no tempo de resposta" _site/cv/cv-pt.html
          grep -q "40% reduction in critical-response time" _site/cv/cv-en.html
          grep -q "31% menos retrabalho por registros incompletos" _site/case_study_02_leadtime_final.html
          grep -q "31% less rework from incomplete request records" _site/en/cases/case-02-lead-time-governance.html
          grep -q -- "-31%" _site/case_study_03_habitat_final.html
          test -f _site/case_study_01_persona_final.html
          test -f _site/case_study_02_leadtime_final.html
          test -f _site/case_study_03_habitat_final.html
          test -f _site/case_study_04_shv_final.html
          test -f _site/case_study_05_pav_receita_federal_final.html
          test -f _site/case_study_06_peixe_urbano_final.html
          test -f _site/case_study_06_peixe_urbano_artifacts.html
          test -f _site/case04_documentacao.html
          test -f _site/case05_documentacao.html
          test -f _site/en/cases/case-04-shv-documentation.html
          test -f _site/en/cases/case-05-pav-documentation.html
          test -f _site/en/cases/case-01-virtual-assistant.html
          test -f _site/en/cases/case-02-lead-time-governance.html
          test -f _site/en/cases/case-03-habitat-saas.html
          test -f _site/en/cases/case-04-shv-energy.html
          test -f _site/en/cases/case-05-pav-receita-federal.html
          test -f _site/en/cases/case-06-peixe-urbano.html
          ! find _site -type f \( -path '*/data/*' -o -path '*/career-os/*' -o -path '*/scripts/*' -o -path '*/docs/*' \) | grep -q .
          grep -RniE 'whatsapp|wa\.me/5521986314378' _site/index.html _site/en/index.html >/dev/null
          ! grep -Rni 'undefined</main>' _site/en/cases >/dev/null

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published site
        shell: bash
        run: |
          set -u
          base="https://c2shespanhol-ops.github.io/meuportifolio"
          check_site() {
            rm -f /tmp/pt.html /tmp/en.html /tmp/cv.html /tmp/cv-pt.pdf /tmp/cv-en.pdf
            curl -fsSL "$base/" > /tmp/pt.html || return 1
            curl -fsSL "$base/en/" > /tmp/en.html || return 1
            curl -fsSL "$base/cv/cv-pt.html" > /tmp/cv.html || return 1
            grep -q "Cleyton Hespanhol | Product Owner | UX" /tmp/pt.html || return 1
            grep -q "Product Owner | UX" /tmp/en.html || return 1
            grep -q "Product Owner" /tmp/cv.html || return 1
            grep -q "Servidor Destaque" /tmp/cv.html && return 1
            grep -q "undefined</main>" /tmp/en.html && return 1
            curl -fsSL "$base/cv/Cleyton-Hespanhol-Product-Owner-PT.pdf" -o /tmp/cv-pt.pdf || return 1
            curl -fsSL "$base/cv/Cleyton-Hespanhol-Product-Owner-EN.pdf" -o /tmp/cv-en.pdf || return 1
            test "$(head -c 4 /tmp/cv-pt.pdf)" = "%PDF" || return 1
            test "$(head -c 4 /tmp/cv-en.pdf)" = "%PDF" || return 1
            for path in \
              case_study_01_persona_final.html \
              case_study_02_leadtime_final.html \
              case_study_03_habitat_final.html \
              case_study_04_shv_final.html \
              case_study_05_pav_receita_federal_final.html \
              case_study_06_peixe_urbano_final.html \
              case_study_06_peixe_urbano_artifacts.html \
              case04_documentacao.html \
              case05_documentacao.html \
              en/cases/case-04-shv-documentation.html \
              en/cases/case-05-pav-documentation.html \
              en/cases/case-01-virtual-assistant.html \
              en/cases/case-02-lead-time-governance.html \
              en/cases/case-03-habitat-saas.html \
              en/cases/case-04-shv-energy.html \
              en/cases/case-05-pav-receita-federal.html \
              en/cases/case-06-peixe-urbano.html; do
              curl -fsSL "$base/$path" >/tmp/page.html || return 1
              grep -q "undefined</main>" /tmp/page.html && return 1
            done
            return 0
          }
          for i in $(seq 1 60); do
            if check_site; then
              echo "HTTP smoke test passed on attempt $i."
              exit 0
            fi
            echo "HTTP smoke test not ready on attempt $i; waiting 5s."
            sleep 5
          done
          echo "Published site did not become reachable or failed smoke-test assertions."
          exit 1
