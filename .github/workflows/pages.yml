name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'docs' \
            --exclude 'data' \
            --exclude 'career-os' \
            --exclude 'scripts' \
            --exclude '_site'

      - name: Validate public artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/en/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/cv/cv-pt.html
          test -f _site/cv/cv-en.html
          test -f _site/case_study_01_persona_final.html
          test -f _site/case_study_02_leadtime_final.html
          test -f _site/case_study_03_habitat_final.html
          test -f _site/case_study_05_pav_receita_federal_final.html
          test -f _site/en/cases/case-01-virtual-assistant.html
          test -f _site/en/cases/case-02-lead-time-governance.html
          test -f _site/en/cases/case-03-habitat-saas.html
          test -f _site/en/cases/case-05-pav-receita-federal.html
          ! find _site -type f \( -path '*/data/*' -o -path '*/career-os/*' -o -path '*/scripts/*' -o -path '*/docs/*' \) | grep -q .
          ! grep -RniE '\+55[0-9 ()-]{8,}|whatsapp' _site >/dev/null
          ! grep -Rni 'undefined</main>' _site/en/cases >/dev/null

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published site
        shell: bash
        run: |
          set -euo pipefail
          base="https://c2shespanhol-ops.github.io/meuportifolio"
          for i in $(seq 1 12); do
            if curl -fsSL "$base/" > /tmp/pt.html &&                curl -fsSL "$base/en/" > /tmp/en.html &&                curl -fsSL "$base/cv/cv-pt.html" > /tmp/cv.html; then
              grep -q "Cleyton Hespanhol | Product Owner | UX" /tmp/pt.html
              grep -q "Product Owner | UX" /tmp/en.html
              grep -q "Product Owner" /tmp/cv.html
              ! grep -q "undefined</main>" /tmp/en.html
              exit 0
            fi
            sleep 5
          done
          echo "Published site did not become reachable or failed smoke-test assertions."
          exit 1
