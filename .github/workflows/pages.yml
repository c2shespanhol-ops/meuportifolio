name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'docs' \
            --exclude 'data' \
            --exclude 'career-os' \
            --exclude 'scripts' \
            --exclude '_site'

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published site
        shell: bash
        run: |
          set -euo pipefail
          base="https://c2shespanhol-ops.github.io/meuportifolio"
          for i in $(seq 1 12); do
            if curl -fsSL "$base/" > /tmp/pt.html &&                curl -fsSL "$base/en/" > /tmp/en.html &&                curl -fsSL "$base/cv/cv-pt.html" > /tmp/cv.html; then
              grep -q "Cleyton Hespanhol | Product Owner | UX" /tmp/pt.html
              grep -q "Product Owner | UX" /tmp/en.html
              grep -q "Product Owner" /tmp/cv.html
              ! grep -q "undefined</main>" /tmp/en.html
              exit 0
            fi
            sleep 5
          done
          echo "Published site did not become reachable or failed smoke-test assertions."
          exit 1
