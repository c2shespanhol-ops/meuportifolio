name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate centralized design tokens
        run: python scripts/validate_design_tokens.py

      - name: Verify removal of the residual nested theme directory
        shell: bash
        run: |
          set -euo pipefail
          test ! -d meuportifolio
          legacy_reference="meuportifolio""/""pbos-career-theme.css"
          matches="$(grep -RIlF \
            --include='*.html' --include='*.css' \
            --include='*.py' --include='*.mjs' --include='*.js' \
            --include='*.yml' --include='*.yaml' \
            --exclude-dir=.git "$legacy_reference" . || true)"
          if [[ -n "$matches" ]]; then
            printf '%s\\n' "$matches"
            echo "::error::References to the removed nested theme directory remain."
            exit 1
          fi
          echo "Residual directory scan passed: directory absent and 0 references across HTML, CSS, scripts and workflows."

      - name: Audit legacy palette before migration
        env:
          PALETTE_AUDIT_BASE_SHA: ${{ github.event.before }}
        run: python scripts/audit_legacy_colors.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'docs' \
            --exclude 'data' \
            --exclude 'career-os' \
            --exclude 'scripts' \
            --exclude '_site'

      - name: Apply shared design system to all HTML pages
        run: |
          python scripts/ensure_shared_theme.py _site
          python scripts/normalize_palette_tokens.py _site

      - name: Build and validate readable CV PDFs
        run: |
          python -m pip install --disable-pip-version-check reportlab pypdf
          python scripts/build_cv_pdfs.py
          python scripts/validate_cv_pdfs.py _site/cv
      - name: Verify CV PDF text with pdftotext
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pt_text="$(pdftotext _site/cv/Cleyton-Hespanhol-Product-Owner-PT.pdf -)"
          en_text="$(pdftotext _site/cv/Cleyton-Hespanhol-Product-Owner-EN.pdf -)"
          for content in "$pt_text" "$en_text"; do
            grep -Fq "Product Owner | UX" <<< "$content"
            grep -Fq "Maricá" <<< "$content"
            grep -Fq "+55 (21) 98631-4378" <<< "$content"
            if grep -Eiq "Niterói|PRODUTO DIGITAL" <<< "$content"; then
              echo "::error::Outdated city or brand title remains in a generated CV PDF."
              exit 1
            fi
          done
          printf '%s\n' "PT PDF proof:"
          grep -E "Product Owner \\| UX|Maricá|\\+55 \\(21\\) 98631-4378" <<< "$pt_text"
          printf '%s\n' "EN PDF proof:"
          grep -E "Product Owner \\| UX|Maricá|\\+55 \\(21\\) 98631-4378" <<< "$en_text"
          pt_info="$(pdfinfo _site/cv/Cleyton-Hespanhol-Product-Owner-PT.pdf)"
          en_info="$(pdfinfo _site/cv/Cleyton-Hespanhol-Product-Owner-EN.pdf)"
          if grep -Eiq '98631|5521986314378' <<< "$pt_info$en_info"; then
            echo "::error::Phone number must not appear in PDF metadata."
            exit 1
          fi
          printf '%s\n' "$pt_info" | grep '^Pages:'
          printf '%s\n' "$en_info" | grep '^Pages:'

      - name: Upload generated CV PDFs for versioning
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-cv-pdfs
          path: _site/cv/*.pdf
          retention-days: 14
      - name: Validate approved palette and reject legacy colors
        run: python scripts/validate_design_tokens.py _site
      - name: Validate HTML structure and internal links
        run: python scripts/validate_html.py _site

      - name: Validate copy spacing
        run: python scripts/validate_copy_quality.py _site

      - name: Install responsive test browser
        run: |
          npm install --no-save playwright axe-core cspell @cspell/dict-pt-br@2.4.4
          npx cspell --no-progress --config cspell.json "_site/**/*.html"
          npx playwright install --with-deps chromium
          python -m http.server 8765 --directory _site >/tmp/portfolio-http.log 2>&1 &
          sleep 2
          node scripts/validate_responsive.mjs
          node scripts/validate_analytics_consent.mjs
          node scripts/validate_contrast.mjs

      - name: Upload legacy color audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-color-audit
          path: artifacts/legacy-color-audit.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload responsive before-and-after evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-responsive-audit
          path: artifacts/responsive-audit/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload contrast audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-contrast-audit
          path: artifacts/contrast-audit/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload privacy consent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-privacy-consent-audit
          path: artifacts/privacy-consent/
          if-no-files-found: warn
          retention-days: 14

      - name: Validate public artifact
        shell: bash
        run: |
          set -euo pipefail
          set -x
          test -f _site/index.html
          test -f _site/en/index.html
          grep -q 'class="about-photo"' _site/index.html
          grep -q 'class="about-photo"' _site/en/index.html
          test -s _site/assets/cleyton-profile.jpg
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/cv/cv-pt.html
          test -f _site/cv/cv-en.html
          test -f _site/cv/Cleyton-Hespanhol-Product-Owner-PT.pdf
          test -f _site/cv/Cleyton-Hespanhol-Product-Owner-EN.pdf
          test "$(head -c 4 _site/cv/Cleyton-Hespanhol-Product-Owner-PT.pdf)" = "%PDF"
          test "$(head -c 4 _site/cv/Cleyton-Hespanhol-Product-Owner-EN.pdf)" = "%PDF"
          test -f _site/case_study_01_persona_final.html
          test -f _site/case_study_02_leadtime_final.html
          test -f _site/case_study_03_habitat_final.html
          test -f _site/case03_matriz_evidencias.html
          test -f _site/case_study_04_shv_final.html
          test -f _site/case_study_05_pav_receita_federal_final.html
          test -f _site/case_study_06_peixe_urbano_final.html
          test -f _site/case_study_06_peixe_urbano_artifacts.html
          test -f _site/case04_documentacao.html
          test -f _site/case05_documentacao.html
          test -f _site/case01_documento_visao.html
          test -f _site/case01_personas.html
          test -f _site/case01_jornada_usuario.html
          test -f _site/case01_arquitetura_conversacional.html
          test -f _site/case01_prompt_mestre.html
          test -f _site/case01_guia_tom_voz.html
          test -f _site/case01_prototipo_conceitual.html
          test -f _site/case01_requisitos_funcionais.html
          test -f _site/case01_briefing_reconstruido.html
          test -f _site/case01_fluxogramas.html
          test -f _site/case01_documentacao_complementar.html
          test -f _site/case01_metricas_impacto.html
          test -f _site/en/cases/case-01-measurement-framework.html
          test -f _site/case03_protocolo_mestre.html
          test -f _site/en/cases/case-03-habitat-documentation-history.html
          test -f _site/protocolo_maria.html
          test -f _site/case02_product_discovery_report.html
          test -f _site/case02_as_is_to_be_mapping.html
          test -f _site/case02_service_workflow_design.html
          test -f _site/case02_governance_prioritization_framework.html
          test -f _site/case02_decision_playbook.html
          test -f _site/case02_stakeholder_alignment.html
          test -f _site/case02_product_success_metrics.html
          test -f _site/case02_lessons_learned.html
          test -f _site/Central_Conhecimento.html
          test -f _site/modelo_onboarding.html
          test -f _site/fluxo_operacional.html
          test -f _site/mapa_jornada_usuario.html
          test -f _site/fluxo_discovery.html
          test -f _site/protocolo_habitat.html
          test -f _site/artefato_protocolo_habitat.html
          test -f _site/protocolo_gestao_incidentes.html
          test -f _site/relatorio_leadtime.html
          test -f _site/case05_checklist_prontidao.html
          test -f _site/case05_jornada_cidadao.html
          test -f _site/case05_mapa_stakeholders.html
          test -f _site/case05_plano_validacao_usuario.html
          test -f _site/en/cases/case-04-shv-documentation.html
          test -f _site/en/cases/case-05-pav-documentation.html
          test -f _site/en/cases/case-01-virtual-assistant.html
          test -f _site/en/cases/case-02-lead-time-governance.html
          test -f _site/en/cases/case-02-supporting-documents.html
          test -f _site/en/cases/case-02-operational-discovery-report.html
          test -f _site/en/cases/case-02-as-is-to-be-mapping.html
          test -f _site/en/cases/case-02-service-workflow-design.html
          test -f _site/en/cases/case-02-governance-prioritization-framework.html
          test -f _site/en/cases/case-02-decision-escalation-playbook.html
          test -f _site/en/cases/case-02-stakeholder-alignment.html
          test -f _site/en/cases/case-02-success-metrics.html
          test -f _site/en/cases/case-02-lessons-learned.html
          test -f _site/en/cases/case-03-habitat-saas.html
          test -f _site/en/cases/case-03-habitat-operational-protocol.html
          test -f _site/en/cases/case-03-habitat-master-protocol.html
          test -f _site/en/cases/case-03-habitat-evidence-matrix.html
          test -f _site/en/cases/case-03-habitat-lead-time-report.html
          test -f _site/en/cases/case-03-habitat-discovery-flow.html
          test -f _site/en/cases/case-03-habitat-operational-workflow.html
          test -f _site/en/cases/case-03-habitat-user-journey-map.html
          test -f _site/en/cases/case-03-habitat-onboarding-model.html
          test -f _site/en/cases/case-03-habitat-incident-management.html
          test -f _site/en/cases/case-04-shv-energy.html
          test -f _site/en/cases/case-05-pav-receita-federal.html
          test -f _site/en/cases/case-06-peixe-urbano.html
          test -f _site/en/cases/case-05-citizen-journey.html
          test -f _site/en/cases/case-05-user-validation.html
          test -f _site/en/cases/case-05-readiness-checklist.html
          test -f _site/en/cases/case-05-stakeholder-map.html
          test -f _site/en/Central_Knowledge.html
          test -f _site/en/cases/case-01-product-vision.html
          test -f _site/en/cases/case-01-proto-personas.html
          test -f _site/en/cases/case-01-user-journey.html
          test -f _site/en/cases/case-01-conversational-architecture.html
          test -f _site/en/cases/case-01-master-prompt.html
          test -f _site/en/cases/case-01-tone-of-voice.html
          test -f _site/en/cases/case-01-conceptual-prototype.html
          test -f _site/en/cases/case-01-functional-requirements.html
          ! find _site -type f \( -path '*/data/*' -o -path '*/career-os/*' -o -path '*/scripts/*' -o -path '*/docs/*' \) | grep -q .
          grep -qi 'mailto:cleyton.s.hespanhol@gmail.com' _site/index.html
          grep -qi 'linkedin.com/in/cleyton-hespanhol' _site/index.html
          grep -qi 'mailto:cleyton.s.hespanhol@gmail.com' _site/en/index.html
          grep -qi 'linkedin.com/in/cleyton-hespanhol' _site/en/index.html
          grep -q 'Maricá City Hall' _site/en/index.html
          grep -q 'Urban Fish (Peixe Urbano)' _site/en/index.html
          if grep -Rni 'undefined</main>' _site/en/cases; then
            echo '::error::Unexpected undefined closing main marker in English case pages.'
            exit 1
          else
            true
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          name: portfolio-pages-${{ github.run_attempt }}
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: portfolio-pages-${{ github.run_attempt }}

      - name: Smoke test published site
        shell: bash
        run: |
          set -u
          base="https://c2shespanhol-ops.github.io/meuportifolio"
          check_site() {
            rm -f /tmp/pt.html /tmp/en.html /tmp/cv.html /tmp/cv-pt.pdf /tmp/cv-en.pdf
            curl -fsSL "$base/" > /tmp/pt.html || return 1
            curl -fsSL "$base/en/" > /tmp/en.html || return 1
            curl -fsSL "$base/cv/cv-pt.html" > /tmp/cv.html || return 1
            grep -q "Cleyton Hespanhol | Product Owner | UX" /tmp/pt.html || return 1
            grep -q "Product Owner | UX" /tmp/en.html || return 1
            grep -q "undefined</main>" /tmp/en.html && return 1
            curl -fsSL "$base/cv/Cleyton-Hespanhol-Product-Owner-PT.pdf" -o /tmp/cv-pt.pdf || return 1
            curl -fsSL "$base/cv/Cleyton-Hespanhol-Product-Owner-EN.pdf" -o /tmp/cv-en.pdf || return 1
            test "$(head -c 4 /tmp/cv-pt.pdf)" = "%PDF" || return 1
            test "$(head -c 4 /tmp/cv-en.pdf)" = "%PDF" || return 1
            for path in \
              case_study_01_persona_final.html \
              case_study_02_leadtime_final.html \
              case_study_03_habitat_final.html \
              case_study_04_shv_final.html \
              case_study_05_pav_receita_federal_final.html \
              case_study_06_peixe_urbano_final.html \
              case_study_06_peixe_urbano_artifacts.html \
              case04_documentacao.html \
              case05_documentacao.html \
              case01_metricas_impacto.html \
              en/cases/case-01-measurement-framework.html \
              case03_protocolo_mestre.html \
              en/cases/case-03-habitat-documentation-history.html \
              protocolo_maria.html \
              case01_documento_visao.html \
              case01_personas.html \
              case01_jornada_usuario.html \
              case01_arquitetura_conversacional.html \
              case01_prompt_mestre.html \
              case01_guia_tom_voz.html \
              case01_prototipo_conceitual.html \
              case01_requisitos_funcionais.html \
              case01_briefing_reconstruido.html \
              case01_fluxogramas.html \
              case01_documentacao_complementar.html \
              case02_product_discovery_report.html \
              case02_as_is_to_be_mapping.html \
              case02_service_workflow_design.html \
              case02_governance_prioritization_framework.html \
              case02_decision_playbook.html \
              case02_stakeholder_alignment.html \
              case02_product_success_metrics.html \
              case02_lessons_learned.html \
              Central_Conhecimento.html \
              modelo_onboarding.html \
              fluxo_operacional.html \
              mapa_jornada_usuario.html \
              fluxo_discovery.html \
              protocolo_habitat.html \
              artefato_protocolo_habitat.html \
              protocolo_gestao_incidentes.html \
              relatorio_leadtime.html \
              case05_checklist_prontidao.html \
              case05_jornada_cidadao.html \
              case05_mapa_stakeholders.html \
              case05_plano_validacao_usuario.html \
              en/cases/case-04-shv-documentation.html \
              en/cases/case-05-pav-documentation.html \
              en/cases/case-01-virtual-assistant.html \
              en/cases/case-02-lead-time-governance.html \
              en/cases/case-02-supporting-documents.html \
              en/cases/case-02-operational-discovery-report.html \
              en/cases/case-02-as-is-to-be-mapping.html \
              en/cases/case-02-service-workflow-design.html \
              en/cases/case-02-governance-prioritization-framework.html \
              en/cases/case-02-decision-escalation-playbook.html \
              en/cases/case-02-stakeholder-alignment.html \
              en/cases/case-02-success-metrics.html \
              en/cases/case-02-lessons-learned.html \
              en/cases/case-03-habitat-saas.html \
              en/cases/case-03-habitat-operational-protocol.html \
              en/cases/case-03-habitat-master-protocol.html \
              en/cases/case-03-habitat-evidence-matrix.html \
              en/cases/case-03-habitat-lead-time-report.html \
              en/cases/case-03-habitat-discovery-flow.html \
              en/cases/case-03-habitat-operational-workflow.html \
              en/cases/case-03-habitat-user-journey-map.html \
              en/cases/case-03-habitat-onboarding-model.html \
              en/cases/case-03-habitat-incident-management.html \
              en/cases/case-04-shv-energy.html \
              en/cases/case-05-pav-receita-federal.html \
              en/cases/case-06-peixe-urbano.html; do
              curl -fsSL "$base/$path" >/tmp/page.html || return 1
              grep -q "undefined</main>" /tmp/page.html && return 1
            done
            return 0
          }
          for i in $(seq 1 60); do
            if check_site; then
              echo "HTTP smoke test passed on attempt $i."
              exit 0
            fi
            echo "HTTP smoke test not ready on attempt $i; waiting 5s."
            sleep 5
          done
          echo "Published site did not become reachable or failed smoke-test assertions."
          exit 1

  version-cv-pdfs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated CV PDFs
        uses: actions/download-artifact@v4
        with:
          name: portfolio-cv-pdfs
          path: /tmp/portfolio-cv-pdfs

      - name: Commit regenerated CV PDFs
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/portfolio-cv-pdfs/Cleyton-Hespanhol-Product-Owner-PT.pdf cv/
          cp /tmp/portfolio-cv-pdfs/Cleyton-Hespanhol-Product-Owner-EN.pdf cv/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/Cleyton-Hespanhol-Product-Owner-PT.pdf cv/Cleyton-Hespanhol-Product-Owner-EN.pdf
          if git diff --cached --quiet; then
            echo "Generated CV PDFs already match the committed versions."
          else
            git commit -m "Update generated CV PDFs"
            git push
          fi
