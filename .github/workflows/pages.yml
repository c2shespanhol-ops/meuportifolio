name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'docs' \
            --exclude 'data' \
            --exclude 'career-os' \
            --exclude 'scripts' \
            --exclude '_site'

      - name: Generate recruiter CV PDFs
        run: |
          python -m pip install --disable-pip-version-check --no-input reportlab
          python scripts/build_cv_pdfs.py

      - name: Validate public artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/en/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/cv/cv-pt.html
          test -f _site/cv/cv-en.html
          test -f _site/cv/Cleyton-Hespanhol-Product-Owner-PT.pdf
          test -f _site/cv/Cleyton-Hespanhol-Product-Owner-EN.pdf
          test "$(head -c 4 _site/cv/Cleyton-Hespanhol-Product-Owner-PT.pdf)" = "%PDF"
          test "$(head -c 4 _site/cv/Cleyton-Hespanhol-Product-Owner-EN.pdf)" = "%PDF"
          test -f _site/case_study_01_persona_final.html
          test -f _site/case_study_02_leadtime_final.html
          test -f _site/case_study_03_habitat_final.html
          test -f _site/case_study_04_shv_final.html
          test -f _site/case_study_05_pav_receita_federal_final.html
          test -f _site/en/cases/case-01-virtual-assistant.html
          test -f _site/en/cases/case-02-lead-time-governance.html
          test -f _site/en/cases/case-03-habitat-saas.html
          test -f _site/en/cases/case-04-shv-energy.html
          test -f _site/en/cases/case-05-pav-receita-federal.html
          ! find _site -type f \( -path '*/data/*' -o -path '*/career-os/*' -o -path '*/scripts/*' -o -path '*/docs/*' \) | grep -q .
          grep -RniE 'whatsapp|wa\.me/5521986314378' _site/index.html _site/en/index.html >/dev/null
          ! grep -Rni 'undefined</main>' _site/en/cases >/dev/null

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published site
        shell: bash
        run: |
          set -u
          base="https://c2shespanhol-ops.github.io/meuportifolio"
          check_site() {
            rm -f /tmp/pt.html /tmp/en.html /tmp/cv.html /tmp/cv-pt.pdf /tmp/cv-en.pdf
            curl -fsSL "$base/" > /tmp/pt.html || return 1
            curl -fsSL "$base/en/" > /tmp/en.html || return 1
            curl -fsSL "$base/cv/cv-pt.html" > /tmp/cv.html || return 1
            grep -q "Cleyton Hespanhol | Product Owner | UX" /tmp/pt.html || return 1
            grep -q "Product Owner | UX" /tmp/en.html || return 1
            grep -q "Product Owner" /tmp/cv.html || return 1
            grep -q "Servidor Destaque" /tmp/cv.html && return 1
            grep -q "undefined</main>" /tmp/en.html && return 1
            curl -fsSL "$base/cv/Cleyton-Hespanhol-Product-Owner-PT.pdf" -o /tmp/cv-pt.pdf || return 1
            curl -fsSL "$base/cv/Cleyton-Hespanhol-Product-Owner-EN.pdf" -o /tmp/cv-en.pdf || return 1
            test "$(head -c 4 /tmp/cv-pt.pdf)" = "%PDF" || return 1
            test "$(head -c 4 /tmp/cv-en.pdf)" = "%PDF" || return 1
            for path in \
              case_study_01_persona_final.html \
              case_study_02_leadtime_final.html \
              case_study_03_habitat_final.html \
              case_study_04_shv_final.html \
              case_study_05_pav_receita_federal_final.html \
              en/cases/case-01-virtual-assistant.html \
              en/cases/case-02-lead-time-governance.html \
              en/cases/case-03-habitat-saas.html \
              en/cases/case-04-shv-energy.html \
              en/cases/case-05-pav-receita-federal.html; do
              curl -fsSL "$base/$path" >/tmp/page.html || return 1
              grep -q "undefined</main>" /tmp/page.html && return 1
            done
            return 0
          }
          for i in $(seq 1 60); do
            if check_site; then
              echo "HTTP smoke test passed on attempt $i."
              exit 0
            fi
            echo "HTTP smoke test not ready on attempt $i; waiting 5s."
            sleep 5
          done
          echo "Published site did not become reachable or failed smoke-test assertions."
          exit 1
