name: Archive WCAG and privacy audit evidence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/archive-audit-evidence.yml

permissions:
  actions: read
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download original contrast audit artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-contrast-audit
          run-id: 43955284991
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/audit/contrast

      - name: Download original privacy audit artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-privacy-consent-audit
          run-id: 43955284991
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/audit/privacy

      - name: Package original evidence and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidencias/auditoria-2026-11-16/arquivos-originais
          cd /tmp/audit
          zip -qr "$GITHUB_WORKSPACE/evidencias/auditoria-2026-11-16/arquivos-originais/portfolio-contrast-audit.zip" contrast
          zip -qr "$GITHUB_WORKSPACE/evidencias/auditoria-2026-11-16/arquivos-originais/portfolio-privacy-consent-audit.zip" privacy
          cd "$GITHUB_WORKSPACE/evidencias/auditoria-2026-11-16/arquivos-originais"
          sha256sum *.zip > SHA256SUMS.txt
          ls -lh

      - name: Commit permanent audit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidencias/auditoria-2026-11-16/arquivos-originais
          git commit -m "Archive original WCAG and privacy audit evidence"
          git push
