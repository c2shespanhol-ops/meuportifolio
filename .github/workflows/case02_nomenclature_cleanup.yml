name: Case 02 nomenclature cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, 'Case 02 nomenclature cleanup')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Case Study 02 terminology
        shell: python
        run: |
          from pathlib import Path
          files = [
              Path('case02_product_discovery_report.html'),
              Path('case_study_02_leadtime_final.html'),
          ]
          files += sorted(Path('.').glob('case02_*.html'))
          for p in dict.fromkeys(files):
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              # Remove citation artifacts introduced in the generated HTML.
              import re
              s = re.sub(r'\[cite:\s*\d+\]', '', s, flags=re.I)
              # Protect portfolio identity references and replace explicit personal narration.
              s = s.replace('Cleyton Hespanhol tornou-se o ponto focal dessa jornada.', 'A atuação como ponto focal passou a centralizar essa jornada.')
              s = s.replace('Cleyton deixou de esperar', 'A atuação deixou de esperar')
              s = s.replace('criado por Cleyton', 'criado como mecanismo de acompanhamento')
              s = s.replace('criado por iniciativa de Cleyton', 'criado por iniciativa própria')
              s = s.replace('Cleyton entrava em contato', 'era realizado contato')
              s = s.replace('Cleyton orientava o servidor', 'a orientação era realizada com o servidor')
              s = s.replace('Cleyton participou da definição', 'Houve participação na definição')
              s = s.replace('Cleyton ia até o usuário', 'a orientação era realizada diretamente com o usuário')
              s = s.replace('Cleyton acionava o TI', 'era acionado o TIC')
              s = s.replace('Cleyton passou a atuar', 'A atuação passou a ocorrer')
              # Remove the specific operational 24-hour mechanism from public-facing material.
              s = re.sub(r'.{0,180}(margem operacional de 24 horas|SLA de 24 horas|24 horas no controle|24 horas não era uma regra).{0,260}', '', s, flags=re.I|re.S)
              s = s.replace('margem operacional de 24 horas', 'monitoramento ativo')
              s = s.replace('acrescentava uma margem operacional de 24 horas', 'utilizava um mecanismo interno de acompanhamento')
              s = s.replace('Margem operacional de 24 horas', 'Monitoramento ativo')
              # Canonical department name: first and subsequent references use TIC.
              s = s.replace('Departamento de Tecnologia da Informação e Comunicação e Comunicação', 'Departamento de Tecnologia da Informação e Comunicação')
              s = re.sub(r'Departamento de Tecnologia da Informação\b', 'Departamento de Tecnologia da Informação e Comunicação (TIC)', s)
              s = re.sub(r'Departamento de TI\b', 'Departamento de Tecnologia da Informação e Comunicação (TIC)', s)
              s = re.sub(r'\bDepartamento de TIC\b', 'Departamento de Tecnologia da Informação e Comunicação (TIC)', s)
              # Remaining short references in case documents should be TIC, except the canonical expansion above.
              s = re.sub(r'\bcom o TI\b', 'com o TIC', s)
              s = re.sub(r'\bcom TI\b', 'com TIC', s)
              s = re.sub(r'\bdo TI\b', 'do TIC', s)
              s = re.sub(r'\bno TI\b', 'no TIC', s)
              s = re.sub(r'\bpara o TI\b', 'para o TIC', s)
              s = re.sub(r'\bpara TI\b', 'para TIC', s)
              s = re.sub(r'\bcom o departamento de TI\b', 'com o TIC', s, flags=re.I)
              # Fix legacy Case 02 links in Document 01.
              s = s.replace('href="case_study_02.html"', 'href="https://c2shespanhol-ops.github.io/meuportifolio/case_study_02_leadtime_final.html"')
              p.write_text(s, encoding='utf-8')
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case02_*.html case_study_02_leadtime_final.html
          git diff --cached --quiet && exit 0
          git commit -m "Case 02 nomenclature cleanup"
          git push
