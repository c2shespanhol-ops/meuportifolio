name: Career OS · LinkedIn Sync

on:
  push:
    paths:
      - "career-os/inbox/linkedin-profile.json"
      - "career-os/linkedin-sync.mjs"
  workflow_dispatch:
    inputs:
      apply:
        description: "Aplicar o snapshot depois da revisão do diff"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run LinkedIn diff
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f career-os/inbox/linkedin-profile.json ]]; then
            echo "snapshot_available=true" >> "$GITHUB_OUTPUT"
            node career-os/linkedin-sync.mjs | tee linkedin-sync-report.json
          else
            echo "snapshot_available=false" >> "$GITHUB_OUTPUT"
            cat > linkedin-sync-report.json <<'REPORT'
          {
            "status": "no_pending_snapshot",
            "changeCount": 0,
            "changes": [],
            "message": "Nenhum snapshot pendente em career-os/inbox/linkedin-profile.json. Nenhum dado foi alterado."
          }
          REPORT
            echo "::notice::No pending LinkedIn snapshot. Dry-run completed without changing profile data."
          fi

      - name: Upload diff report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linkedin-sync-report
          path: linkedin-sync-report.json

  apply:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Apply snapshot after explicit approval
        shell: bash
        env:
          APPLY: "true"
        run: |
          set -euo pipefail
          node career-os/linkedin-sync.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add career-os/linkedin-profile.json career-os/inbox/linkedin-profile.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "chore: apply reviewed LinkedIn profile snapshot"
            git push
          fi
