name: Standardize portfolio visual system

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply shared visual system
        run: python3 scripts/standardize_portfolio.py

      - name: Commit visual standardization
        run: |
          git config user.name "PBOS Portfolio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html' portfolio-theme.css scripts/standardize_portfolio.py
          if git diff --cached --quiet; then
            echo "No visual changes needed."
          else
            git commit -m "design: standardize PBOS portfolio visual system"
            git push
          fi
